    Projects:
      - name: Convergence Detection in MCMC Sampling
        start_date: Jan 2025
        end_date: May 2025
        highlights:
          - Proposed ML-based detection of convergence in Metropolis-Hastings chains using logistic regression and LSTM, achieving 98.5% accuracy on synthetic time-series.
          - Extracted statistical and autocorrelation features via sliding windows; benchmarked ML performance against the traditional R-hat diagnostic with faster and more robust results.

      - name: "IM4WAV: I Hear Your True Colors in Stereo"
        start_date: Sep 2023
        end_date: Dec 2023
        highlights:
          - Built an image-to-stereo-audio deep learning model (IM4WAV) on top of IM2WAV mono-audio generation, combining DINOv2-based depth estimation and segmentation, CLIP image-to-latent encoding, VQ-VAE, and sound-localization techniques.
          - Benchmarked IM4WAV with a pretrained AudioSet classifier and Frechet Inception Distance to measure the gap between generated and real audio distributions.
          - Achieved a slight improvement over the IM2WAV state-of-the-art, demonstrating better fidelity for image-to-audio generation.

      - name: Identifying Relevant Research (EvaDB Project)
        start_date: Aug 2023
        end_date: Dec 2023
        highlights:
          - Built a research-paper summarization app on top of EvaDB (an SQL API for AI applications), integrating a PDF loader to ingest academic papers.
          - Used OpenAI APIs and LangChain to extract and summarize critical content from long academic texts.
          - Implemented a similarity function to surface related papers for users.
