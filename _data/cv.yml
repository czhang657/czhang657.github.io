    Experience:
      - company: Info Lab, Worcester Polytechnic Institute (Data Science Department)
        position: "Research Assistant — Advisor: Prof. Kyumin Lee"
        location: Worcester, MA
        start_date: Aug 2025
        end_date: Present
        highlights:
          - Proposed and developed Hybrid-LoRA, a parameter-efficient post-training framework for LLMs that combines full fine-tuning and LoRA under fixed parameter budgets, aiming to approach full fine-tuning performance at low cost.
          - Designed the core hybrid adaptation architecture, including module-level FFT/LoRA routing, budget-aware allocation, and gradient- and sensitivity-based scoring to decide which Transformer attention and FFN submodules require full-parameter updates.
          - Implemented the full Hybrid-LoRA experimental pipeline in PyTorch and HuggingFace, including custom LoRA layers, hybrid FFT/LoRA routing, rank-pruning modules, Qwen-series fine-tuning, multi-seed benchmark evaluation, gradient checkpointing, mixed precision, and vLLM-based inference acceleration.
          - Developed a two-stage multimodal fusion framework for few-shot species identification from melting-curve data, encoding structured statistical prompts and fusing them with long-sequence time-series representations via self-attention.

      - company: Worcester Polytechnic Institute, Data Science Department
        position: "Teaching Assistant, CS 554 Natural Language Processing — Advisor: Prof. Xiaozhong Liu"
        location: Worcester, MA
        start_date: Aug 2025
        end_date: Present
        highlights:
          - Designed and led a large-scale LLM trading-agent project in which student teams built autonomous market agents using foundation models, instruction tuning, and RL algorithms (PPO, GRPO, DAPO).
          - Architected the full training, evaluation, and deployment pipeline, including a 10-day live market simulator, reward modeling, policy optimization modules, and an automated real-time leaderboard.
          - Built the end-to-end project framework covering market observation, news retrieval, technical indicators, portfolio decision-making, reward modeling, policy optimization, and leaderboard-based evaluation.
          - Mentored teams on advanced RL techniques, reward shaping, tool-augmented decision pipelines (news retrieval, technical indicators), and alignment between language models and trading objectives.

      - company: D2I Lab, Georgia Institute of Technology (College of Computing)
        position: "Graduate Research Assistant — Advisor: Prof. Kexin Rong"
        location: Atlanta, GA
        start_date: May 2024
        end_date: Jul 2025
        highlights:
          - Developed a framework to quantify cleaning-method transferability using regression RMSE across partitioned time-series datasets, and visualized results with heatmaps and temporal drift metrics.
          - Applied DiffPrep's differentiable operator selection to automatically optimize cleaning pipelines and benchmarked its cross-domain performance against fixed-rule baselines.

